apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: counter-service-pipeline
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/H4RmYxDD/ci-cd-final-project.git
    - name: app-name
      type: string
      default: cicd-app
    - name: build-image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/sn-labs-h698416/counter-service:latest
  workspaces:
    - name: output
  tasks:
    - name: cleanup
      taskRef:
        kind: Task
        name: cleanup
      workspaces:
        - name: source
          workspace: output

    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        kind: ClusterTask
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: main
        - name: deleteExisting
          value: "false"
      workspaces:
        - name: output
          workspace: output

    - name: eslint
      runAfter:
        - git-clone
      taskRef:
        kind: Task
        name: eslint
      workspaces:
        - name: source
          workspace: output

    - name: jest-test
      runAfter:
        - eslint
      taskRef:
        kind: Task
        name: jest-test
      params:
        - name: args
          value: "-v"
      workspaces:
        - name: source
          workspace: output

    - name: buildah
      runAfter:
        - jest-test
      taskRef:
        kind: ClusterTask
        name: buildah
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
        - name: TLSVERIFY
          value: "true"
      workspaces:
        - name: source
          workspace: output

    - name: deploy
      runAfter:
        - buildah
      taskRef:
        kind: ClusterTask
        name: openshift-client
      params:
        - name: SCRIPT
          value: |
            oc create deployment $(params.app-name) \
              --image=$(params.build-image) \
              --dry-run=client -o yaml | oc apply -f -